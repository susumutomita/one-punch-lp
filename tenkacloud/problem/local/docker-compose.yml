services:
  tutorial:
    build:
      context: ..
      dockerfile: local/Dockerfile
    environment:
      FLAG_SEED: ${FLAG_SEED:-one-punch-local-seed}
    ports:
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18081:18081"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
