name: Bootstrap repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/one-punch-lp.tar.xz
          mkdir -p /tmp/one-punch-lp
          tar -xJf /tmp/one-punch-lp.tar.xz -C /tmp/one-punch-lp
          rsync -a --delete --exclude='.git/' /tmp/one-punch-lp/ ./
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit restored implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Implement One Punch LP MVP'
          git push
